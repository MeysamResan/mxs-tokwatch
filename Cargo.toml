[package]
name = "tokwatch"
version = "0.2.0"
edition = "2024"
description = "A lightweight native Windows tray monitor for Codex and Claude usage"
license = "MIT"
repository = "https://github.com/MeysamResan/mxs-tokwatch"
readme = "README.md"
keywords = ["codex", "windows", "tray", "usage", "monitor"]
categories = ["gui"]
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Networking_WinHttp", "Win32_Security_Cryptography",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Security",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading",
  "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Time", "Win32_System_JobObjects", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"




[build-dependencies]
embed-manifest = "1.5"
