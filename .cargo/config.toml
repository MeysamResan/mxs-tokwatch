# Keep the Windows application self-contained with respect to its C/unwind runtime.
# The operating system's own DLLs remain normal dynamic imports.
[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
